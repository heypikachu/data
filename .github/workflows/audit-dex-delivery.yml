name: dexH!P - Auditoria de entrega

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_dex_delivery.py'
      - '.github/workflows/audit-dex-delivery.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Comparar codigo publicado e links dos posts
        run: python3 scripts/audit_dex_delivery.py
      - name: Publicar relatorio tecnico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- hp-dex/delivery-audit.json; then
            exit 0
          fi
          git add hp-dex/delivery-audit.json
          git commit -m 'dexH!P: relatorio tecnico de entrega CDN'
          git pull --rebase origin main
          git push origin HEAD:main
