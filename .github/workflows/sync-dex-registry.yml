name: dexH!P - Registro automatico de fichas

on:
  schedule:
    - cron: '27 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'pokemon/*.json'
      - 'scripts/sync_dex_registry.py'

permissions:
  contents: write

concurrency:
  group: hp-dex-registry
  cancel-in-progress: false

jobs:
  atualizar-registro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Testar integridade do sincronizador
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Detectar fichas publicadas no Blogger
        run: python3 scripts/sync_dex_registry.py
      - name: Salvar registro somente quando mudar
        run: |
          if git diff --quiet -- hp-dex/registry.json; then
            echo 'Registro ja esta atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hp-dex/registry.json
          git commit -m 'dexH!P: atualizar automaticamente fichas publicadas'
          git push
